<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Membership form for RP Tumba Tech Club">
    <meta name="author" content="RP Tumba Tech Club">
    <title>Join Us - RP Tumba Tech Club</title>
    <base href="./">
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Membership Registration Form</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="services.html">Activities</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="form.html">Join Us</a></li>
                <li><a href="media.html">Gallery</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <form action="submit.html" method="post">
            <fieldset>
                <legend>Personal Information</legend>

                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" required><br><br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required><br><br>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone"><br><br>

                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob"><br><br>

                <label for="age">Age:</label>
                <input type="number" id="age" name="age" min="15" max="100"><br><br>

                <label for="gender">Gender:</label>
                <select id="gender" name="gender">
                    <optgroup label="Select one">
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </optgroup>
                </select><br><br>
            </fieldset>

            <fieldset>
                <legend>Club Preferences</legend>

                <label for="skills">Your Skills:</label><br>
                <textarea id="skills" name="skills" rows="4" cols="40"></textarea><br><br>

                <label for="interest">Area of Interest:</label>
                <input list="interests" id="interest" name="interest">
                <datalist id="interests">
                    <option value="Web Development">
                    <option value="Robotics">
                    <option value="Cybersecurity">
                    <option value="AI & Machine Learning">
                </datalist><br><br>

                <p>Preferred Meeting Days:</p>
                <input type="checkbox" id="monday" name="days" value="Monday">
                <label for="monday">Monday</label>
                <input type="checkbox" id="wednesday" name="days" value="Wednesday">
                <label for="wednesday">Wednesday</label>
                <input type="checkbox" id="friday" name="days" value="Friday">
                <label for="friday">Friday</label><br><br>

                <p>Membership Type:</p>
                <input type="radio" id="regular" name="membership" value="Regular" checked>
                <label for="regular">Regular</label>
                <input type="radio" id="premium" name="membership" value="Premium">
                <label for="premium">Premium</label><br><br>

                <input type="submit" value="Submit">
            </fieldset>
        </form>
    </main>

    <footer>
        <p>&copy; 2023 RP Tumba Tech Club. All rights reserved.</p>
    </footer>
</body>
</html>
